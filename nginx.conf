server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Catch 404s on missing JS bundles and force a clean reload
    location ~* \.js$ {
        try_files $uri @js_fallback;
    }

    location @js_fallback {
        add_header Content-Type "application/javascript";
        return 200 "console.warn('Stale build detected. Reloading...'); window.location.reload(true);";
    }

    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
    }
}