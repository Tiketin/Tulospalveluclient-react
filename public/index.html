<!DOCTYPE html>
<html lang="fi">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#000000" />
    <meta
      name="Tulospalvelu"
      content="Tulospalvelu"
    />
    <!-- Automatic Cache-Buster & Fail-Safe -->
    <script>
      // 1. Unregister any latent Service Worker from old app versions
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(function(registrations) {
          for (let r of registrations) { r.unregister(); }
        });
      }

      // 2. Global listener for missing bundle 404 errors
      window.addEventListener('error', function(event) {
        var target = event.target || event.srcElement;
        var isStaticAsset = target && (target.tagName === 'SCRIPT' || target.tagName === 'LINK');
        
        if (isStaticAsset) {
          var storageKey = 'app_cache_reload_attempt';
          var lastReload = sessionStorage.getItem(storageKey);
          var now = Date.now();

          // Prevent infinite reload loops (max once per session / 10 sec)
          if (!lastReload || (now - parseInt(lastReload, 10)) > 10000) {
            sessionStorage.setItem(storageKey, now.toString());
            // Appends a cache-busting timestamp parameter to force Nginx to serve new index.html
            var cleanUrl = window.location.href.split('?')[0];
            window.location.replace(cleanUrl + '?v=' + now);
          }
        }
      }, true);
    </script>
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/logo192.png" />
    <!--
      manifest.json provides metadata used when your web app is installed on a
      user's mobile device or desktop. See https://developers.google.com/web/fundamentals/web-app-manifest/
    -->
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    <!--
      Notice the use of %PUBLIC_URL% in the tags above.
      It will be replaced with the URL of the `public` folder during the build.
      Only files inside the `public` folder can be referenced from the HTML.

      Unlike "/favicon.ico" or "favicon.ico", "%PUBLIC_URL%/favicon.ico" will
      work correctly both with client-side routing and a non-root public URL.
      Learn how to configure a non-root public URL by running `npm run build`.
    -->
    <title>Tulospalvelu</title>
    <script src="%PUBLIC_URL%/env-config.js"></script>
  </head>

    <noscript>Sivusto tarvitsee JavaScriptiä toimiakseen.</noscript>
    <div id="root"></div>
